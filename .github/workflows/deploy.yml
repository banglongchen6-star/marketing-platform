name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /root/marketing-platform
            git pull origin main
            npm install
            pm2 delete marketing-platform 2>/dev/null || true
            pm2 start server.js --name marketing-platform
            pm2 save
            echo "✅ Deploy done"
            # 确保 pinxuan.shiganneibu.com 反代到品宣工作台(3002):仅新增配置,自检通过才重载,不动其它站
            printf 'server {\n    listen 80;\n    server_name pinxuan.shiganneibu.com;\n    location / {\n        proxy_pass http://127.0.0.1:3002;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n    }\n}\n' > /etc/nginx/conf.d/pinxuan-shiganneibu.conf
            grep -qE 'conf\.d/\*\.conf' /etc/nginx/nginx.conf || { cp -f /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak_pinxuan; sed -i '0,/http[[:space:]]*{/s//&\n    include \/etc\/nginx\/conf.d\/*.conf;/' /etc/nginx/nginx.conf; }
            if nginx -t 2>/dev/null; then (nginx -s reload || systemctl reload nginx) >/dev/null 2>&1 && echo "✅ pinxuan 路由已确保生效"; else echo "⚠️ nginx 测试未通过,跳过重载并还原(其它站不受影响)"; cp -f /etc/nginx/nginx.conf.bak_pinxuan /etc/nginx/nginx.conf 2>/dev/null; fi
