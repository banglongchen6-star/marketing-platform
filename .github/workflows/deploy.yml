name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /root/marketing-platform
            git pull origin main
            npm install
            pm2 delete marketing-platform 2>/dev/null || true
            pm2 start server.js --name marketing-platform
            pm2 save
            echo "✅ Deploy done"
            echo "===== 完整 nginx.conf ====="
            cat /etc/nginx/nginx.conf
            echo "===== conf.d 目录及内容 ====="
            ls -la /etc/nginx/conf.d/ 2>/dev/null; for f in /etc/nginx/conf.d/*.conf; do echo "--- $f ---"; cat "$f" 2>/dev/null; done
            echo "===== 写入 pinxuan 反代配置 ====="
            printf 'server {\n    listen 80;\n    server_name pinxuan.shiganneibu.com;\n    location / {\n        proxy_pass http://127.0.0.1:3002;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n    }\n}\n' > /etc/nginx/conf.d/pinxuan-shiganneibu.conf
            echo "===== 确保 conf.d 被 include(备份→改→自检→失败则还原) ====="
            cp -f /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak_pinxuan
            if ! grep -qE 'conf\.d/\*\.conf' /etc/nginx/nginx.conf; then
              sed -i '0,/http[[:space:]]*{/s//&\n    include \/etc\/nginx\/conf.d\/*.conf;/' /etc/nginx/nginx.conf
              echo "(已尝试在 http{} 内加入 include conf.d/*.conf)"
            else
              echo "(nginx.conf 已包含 conf.d include)"
            fi
            echo "===== 测试并重载 ====="
            if nginx -t; then (nginx -s reload || systemctl reload nginx) && echo "✅ nginx 已重载,pinxuan 路由应已生效"; else echo "❌ nginx -t 未通过 → 还原 nginx.conf(其它站不受影响)"; cp -f /etc/nginx/nginx.conf.bak_pinxuan /etc/nginx/nginx.conf; nginx -t && (nginx -s reload || systemctl reload nginx); fi
