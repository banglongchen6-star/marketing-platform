name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /root/marketing-platform
            git pull origin main
            npm install
            pm2 delete marketing-platform 2>/dev/null || true
            pm2 start server.js --name marketing-platform
            pm2 save
            echo "✅ Deploy done"
