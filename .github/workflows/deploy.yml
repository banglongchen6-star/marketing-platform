name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd /root/marketing-platform
            git pull origin main
            npm install
            pm2 delete marketing-platform 2>/dev/null || true
            pm2 start server.js --name marketing-platform
            pm2 save
            echo "✅ Deploy done"

            # ============ nginx 域名路由 + HTTPS（幂等；自检不过自动还原，不动其它站） ============
            DOMAIN=pinxuan.shiganneibu.com
            CONF=/etc/nginx/conf.d/pinxuan-shiganneibu.conf
            WEBROOT=/var/www/acme
            CERTD=/etc/nginx/ssl/$DOMAIN
            mkdir -p "$WEBROOT/.well-known/acme-challenge" "$CERTD"
            chmod -R 755 /var/www/acme

            # 1) 尚未启用 HTTPS 时，确保存在 http 版配置（含 ACME 验证目录，供签发证书用）
            if ! grep -q 'ssl_certificate' "$CONF" 2>/dev/null; then
              printf 'server {\n    listen 80;\n    server_name pinxuan.shiganneibu.com;\n    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }\n    location / {\n        proxy_pass http://127.0.0.1:3002;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n    }\n}\n' > "$CONF"
            else
              echo "ℹ️ 已启用 HTTPS，保留现有 nginx 配置（不覆盖）"
            fi

            # 2) 确保主配置 include 了 conf.d
            grep -qE 'conf\.d/\*\.conf' /etc/nginx/nginx.conf || { cp -f /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak_pinxuan; sed -i '0,/http[[:space:]]*{/s//&\n    include \/etc\/nginx\/conf.d\/*.conf;/' /etc/nginx/nginx.conf; }

            # 3) 自检并生效
            if nginx -t 2>/dev/null; then (nginx -s reload || systemctl reload nginx) >/dev/null 2>&1 && echo "✅ pinxuan 路由已生效"; else echo "⚠️ nginx 测试未通过,跳过重载并还原(其它站不受影响)"; cp -f /etc/nginx/nginx.conf.bak_pinxuan /etc/nginx/nginx.conf 2>/dev/null; fi

            # 4) 首次签发免费证书（已有则跳过；acme.sh 是纯脚本，绕开 CentOS8 坏掉的 yum）
            if [ ! -f "$CERTD/fullchain.pem" ]; then
              echo "🔐 未检测到证书，开始申请 Let's Encrypt 免费证书…"
              [ -f /root/.acme.sh/acme.sh ] || curl -s https://get.acme.sh | sh -s email=banglongchen6@gmail.com
              if [ -f /root/.acme.sh/acme.sh ]; then
                /root/.acme.sh/acme.sh --set-default-ca --server letsencrypt >/dev/null 2>&1
                if /root/.acme.sh/acme.sh --issue -d "$DOMAIN" -w "$WEBROOT" --keylength ec-256; then
                  /root/.acme.sh/acme.sh --install-cert -d "$DOMAIN" --ecc --key-file "$CERTD/privkey.pem" --fullchain-file "$CERTD/fullchain.pem" --reloadcmd "nginx -s reload"
                  echo "✅ 证书签发成功（到期前自动续期）"
                else
                  echo "⚠️ 证书签发失败，本次继续用 http（重跑部署可重试）"
                fi
              else
                echo "⚠️ acme.sh 安装失败，本次继续用 http"
              fi
            fi

            # 5) 有证书但还没启用 HTTPS → 切换为 443 + 80 跳转
            if [ -f "$CERTD/fullchain.pem" ] && ! grep -q 'ssl_certificate' "$CONF"; then
              cp -f "$CONF" "$CONF.bak_http"
              printf 'server {\n    listen 80;\n    server_name pinxuan.shiganneibu.com;\n    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }\n    location / { return 301 https://$host$request_uri; }\n}\nserver {\n    listen 443 ssl;\n    server_name pinxuan.shiganneibu.com;\n    ssl_certificate /etc/nginx/ssl/pinxuan.shiganneibu.com/fullchain.pem;\n    ssl_certificate_key /etc/nginx/ssl/pinxuan.shiganneibu.com/privkey.pem;\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_ciphers HIGH:!aNULL:!MD5;\n    ssl_session_cache shared:SSL:10m;\n    ssl_session_timeout 10m;\n    location / {\n        proxy_pass http://127.0.0.1:3002;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_http_version 1.1;\n    }\n}\n' > "$CONF"
              if nginx -t 2>/dev/null; then
                (nginx -s reload || systemctl reload nginx) >/dev/null 2>&1
                echo "🎉 HTTPS 已启用：https://$DOMAIN （http 自动跳转）"
              else
                cp -f "$CONF.bak_http" "$CONF"
                (nginx -s reload || systemctl reload nginx) >/dev/null 2>&1
                echo "⚠️ HTTPS 配置未通过自检，已还原为 http（其它站不受影响）"
              fi
            fi
